# Inhalt in Streamlit Cloud unter Settings > Secrets einfügen. Nicht auf GitHub hochladen.

APP_NAME = "Carey"
APP_PASSWORD = "hier ein Kurspasswort"
DOZENT = "der Dozent des Moduls"

# Variante A  Groq (bewährt, kostenlos ohne Kreditkarte)
# Anderes Modell als bei Boosti, damit sich die Apps das Kontingent nicht teilen
API_BASE = "https://api.groq.com/openai/v1"
API_KEY = "hier Ihr Groq Schlüssel (beginnt mit gsk_)"
MODEL = "openai/gpt-oss-120b"
PROVIDER_NAME = "Groq"
REASONING_EFFORT = "low"

# Variante B  Public AI (zum Ausprobieren obige vier Zeilen ersetzen und REASONING_EFFORT leer lassen)
# API_BASE = "https://api.publicai.co/v1"
# API_KEY = "hier Ihr Public AI Schlüssel"
# MODEL = "swiss-ai/apertus-v1.5-8b"
# PROVIDER_NAME = "Public AI"
# REASONING_EFFORT = ""

# Zugang und Öffnungszeiten (Schweizer Zeit)
ACCESS_OPEN = true
OPEN_DAYS = "Mo,Di,Mi,Do,Fr,Sa,So"
OPEN_FROM = "06:00"
OPEN_UNTIL = "23:00"
END_DATE = "31.07.2027"

# Optional, Feinsteuerung bei Limitmeldungen
# SKRIPT_ZEICHEN = 5000
# UPLOAD_ZEICHEN = 10000
